name: CI

on:
  push:
    branches: [main, master]
    tags: ["*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-x86_64:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Build Linux x86_64 wheels
        uses: PyO3/maturin-action@v1
        with:
          target: x86_64
          manylinux: auto
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
          args: --release --out dist --interpreter 3.10 3.11 3.12 3.13

      - uses: actions/upload-artifact@v4
        with:
          name: dist-linux-x86_64
          path: dist/*

  linux-aarch64:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Build Linux aarch64 wheels
        uses: PyO3/maturin-action@v1
        with:
          target: aarch64
          manylinux: auto
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
          args: --release --out dist --interpreter 3.10 3.11 3.12 3.13

      - uses: actions/upload-artifact@v4
        with:
          name: dist-linux-aarch64
          path: dist/*

  musllinux-x86_64:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Build musllinux x86_64 wheels
        uses: PyO3/maturin-action@v1
        with:
          target: x86_64
          manylinux: musllinux_1_2
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
          args: --release --out dist --interpreter 3.10 3.11 3.12 3.13

      - uses: actions/upload-artifact@v4
        with:
          name: dist-musllinux-x86_64
          path: dist/*

  sdist:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist

      - uses: actions/upload-artifact@v4
        with:
          name: dist-sdist
          path: dist/*
  
  android-aarch64:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install maturin
        run: pip install maturin

      - name: Install Rust Android target
        run: rustup target add aarch64-linux-android

      - name: Install Android NDK
        uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r25b
          add-to-path: true

      - name: Build Android abi3 wheel
        run: |
          export NDK=${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$NDK/aarch64-linux-android24-clang
          export CC=$NDK/aarch64-linux-android24-clang
          export AR=$NDK/llvm-ar
          export ANDROID_API_LEVEL=24
          export RUSTFLAGS="-C link-arg=-Wl,-rpath,/data/data/com.termux/files/usr/lib -C link-arg=-Wl,--no-as-needed"

          maturin build --release \
            --target aarch64-linux-android \
            --out dist \
            --interpreter python3.10 \
            --abi3-python-version 3.10

          for f in dist/*.whl; do
            newname=$(echo "$f" | sed 's/android_[0-9]*_arm64_v8a/linux_aarch64/')
            mv "$f" "$newname"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: dist-android-aarch64
          path: dist/*

  release-github:
    name: Upload everything to GitHub Releases
    runs-on: self-hosted
    if: startsWith(github.ref, 'refs/tags/')
    needs:
      - linux-x86_64
      - linux-aarch64
      - musllinux-x86_64
      - sdist
      - android-aarch64
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-dist
          merge-multiple: true

      - name: Show files
        run: ls -lah release-dist

      - name: Upload assets to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-dist/*
          generate_release_notes: true

  release-pypi:
    name: Publish PyPI dists only
    runs-on: self-hosted
    if: startsWith(github.ref, 'refs/tags/')
    needs:
      - linux-x86_64
      - linux-aarch64
      - musllinux-x86_64
      - sdist
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Keep only PyPI-valid distributions
        shell: bash
        run: |
          shopt -s nullglob

          for f in dist/*; do
            base="$(basename "$f")"
            case "$base" in
              *.whl|*.tar.gz) ;;
              *) rm -f "$f" ;;
            esac
          done

          for f in dist/*.whl; do
            base="$(basename "$f")"
            if [[ "$base" == *-linux_* ]] && [[ "$base" != *manylinux* ]] && [[ "$base" != *musllinux* ]]; then
              echo "Removing non-PyPI wheel: $base"
              rm -f "$f"
            fi
          done

          ls -lah dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          skip-existing: true