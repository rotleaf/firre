name: CI

on:
  push:
    branches: [main, master]
    tags: ["*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-x86_64:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Build Linux x86_64 wheels
        uses: PyO3/maturin-action@v1
        with:
          target: x86_64
          manylinux: auto
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
          args: --release --out dist --interpreter 3.10 3.11 3.12 3.13

      - uses: actions/upload-artifact@v4
        with:
          name: dist-linux-x86_64
          path: dist/*

  linux-aarch64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Build Linux aarch64 wheels
        uses: PyO3/maturin-action@v1
        with:
          target: aarch64
          manylinux: auto
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
          args: --release --out dist --interpreter 3.10 3.11 3.12 3.13

      - uses: actions/upload-artifact@v4
        with:
          name: dist-linux-aarch64
          path: dist/*

  musllinux-x86_64:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Build musllinux x86_64 wheels
        uses: PyO3/maturin-action@v1
        with:
          target: x86_64
          manylinux: musllinux_1_2
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
          args: --release --out dist --interpreter 3.10 3.11 3.12 3.13

      - uses: actions/upload-artifact@v4
        with:
          name: dist-musllinux-x86_64
          path: dist/*

  windows:
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - runner: windows-latest
            target: x64
            python_arch: x64
          - runner: windows-latest
            target: x86
            python_arch: x86
          - runner: windows-11-arm
            target: aarch64
            python_arch: arm64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          architecture: ${{ matrix.python_arch }}

      - name: Build Windows wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
          args: --release --out dist --interpreter 3.13

      - uses: actions/upload-artifact@v4
        with:
          name: dist-windows-${{ matrix.target }}
          path: dist/*

  macos:
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - runner: macos-15-intel
            target: x86_64
          - runner: macos-latest
            target: aarch64
    steps:
      - uses: actions/checkout@v4

      - name: Build macOS wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
          args: --release --out dist --interpreter 3.10 3.11 3.12 3.13

      - uses: actions/upload-artifact@v4
        with:
          name: dist-macos-${{ matrix.target }}
          path: dist/*

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist

      - uses: actions/upload-artifact@v4
        with:
          name: dist-sdist
          path: dist/*

  android-wheel:
    runs-on: ubuntu-22.04
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install cibuildwheel
        run: python -m pip install "cibuildwheel==3.4.0"

      - name: Build Android wheel
        env:
          CIBW_PLATFORM: android
          CIBW_BUILD: cp313-android_aarch64
          CIBW_BUILD_FRONTEND: build
          CIBW_BUILD_VERBOSITY: 1
        run: python -m cibuildwheel --output-dir android-wheelhouse

      - uses: actions/upload-artifact@v4
        with:
          name: dist-android-wheel
          path: android-wheelhouse/*.whl

  release-github:
    name: Upload everything to GitHub Releases
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    needs:
      - linux-x86_64
      - linux-aarch64
      - musllinux-x86_64
      - windows
      - macos
      - sdist
      - android-wheel
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-dist
          merge-multiple: true

      - name: Show files
        run: ls -lah release-dist

      - name: Upload assets to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-dist/*
          generate_release_notes: true

  release-pypi:
    name: Publish PyPI dists only
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    needs:
      - linux-x86_64
      - linux-aarch64
      - musllinux-x86_64
      - windows
      - macos
      - sdist
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Keep only PyPI-valid distributions
        shell: bash
        run: |
          shopt -s nullglob

          # remove android wheels from PyPI upload set
          rm -f dist/*android*.whl || true

          # remove anything that isn't a wheel or sdist
          for f in dist/*; do
            base="$(basename "$f")"
            case "$base" in
              *.whl|*.tar.gz) ;;
              *) rm -f "$f" ;;
            esac
          done

          # remove raw linux wheels if any slip through
          for f in dist/*.whl; do
            base="$(basename "$f")"
            if [[ "$base" == *-linux_* ]] && [[ "$base" != *manylinux* ]] && [[ "$base" != *musllinux* ]]; then
              echo "Removing non-PyPI wheel: $base"
              rm -f "$f"
            fi
          done

          ls -lah dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          skip-existing: true